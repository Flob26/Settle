; Settle - Seat Collision for SMP Cloth - settings (Collision Only install: seated hug and seat swap off)
; Re-read every time an actor sits down: edit, save, then stand up and sit again in game. No restart needed.
; Every setting has a built-in default; deleting a line (or this whole file) restores the default.

[General]
; 0 = Settle does nothing (no seat collision, no hug, no seat swap)
bEnabled = 1
; 1 = only the player is handled; 0 = the player and NPCs
bPlayerOnly = 0
; NPCs farther than this from the player (game units) are ignored
fMaxDistance = 4096

[Collider]
; 1 = only the seat surfaces (upward-facing triangles), pushing cloth UP onto the seat (recommended)
; 0 = every collision triangle of the furniture, two-sided (backrests, legs and armrests too)
bUpFacingOnly = 1
; how flat a triangle must be to count as a seat surface (normal z; 0.5 = up to 60 degrees tilt)
fUpFacingMinZ = 0.5
; collision margin around the seat (game units)
fMargin = 1.0
; cloth up to this far BELOW a seat surface is pushed up onto it (game units)
fPenetration = 12.0
; friction between cloth and seat (0 = slippery, 1 = grippy)
fFriction = 0.5
; armrests and backrest tops: surfaces whose lowest point is more than this above the seat are ignored,
; so cloth beside the thighs is not pushed up over them (game units; -1 = use every upward-facing surface)
fSeatAbove = 3.0

[SeatSwap]
; 1 = use hand-tuned seated physics files listed in SKSE\Plugins\Settle\SeatSwap\*.ini (see the readme there)
bSeatSwap = 0

[AutoHug]
; Seated hug: while seated, the lower cloth of short skirts and robes is tied to the thighs (and shins below the knee),
; so it lies on the lap instead of hanging through the legs. Long skirts keep normal physics + seat collision.
bAutoHug = 0
; skirts whose cloth reaches further below the knee than this get no hug (0 = knee, 1 = ankle; 0 = always hug)
fHugLongSkirt = 0.18
; seconds after sitting down before the settled cloth is locked in place (stops jitter; 0 = never lock)
fHugFreezeDelay = 2.5
; cloth lies this close to the thigh / shin centre line (game units, about the leg radius). Lower = flatter on the lap
fHugSurface = 5.5
fHugShinSurface = 5.0
; cloth behind the thighs is lifted this far toward the legs (game units; 0 = off)
fHugBackLift = 3.5

; --- advanced (change only if you know why) ---
; which cloth bones are tied: position along the thigh (0 = hip, 1 = knee) and max distance from it (game units)
fHugMinT = -0.05
fHugMaxT = 1.15
fHugMaxDist = 35
; a bone is tied to the shin instead of the thigh when it is beyond this point along the thigh
fHugKneeT = 0.9
; how far below the knee shin ties reach (0 = knee, 1 = ankle; 0 = no shin ties)
fHugShinMax = 1.0
; how far cloth may be pulled onto the leg (game units) and which share of its distance (1 = all the way)
fHugPull = 30
fHugPullFraction = 1.0
; play around the tied position: 0 = rigid (recommended). Springs are only used when these are > 0
fHugLinearLimit = 0.0
fHugAngularLimit = 0.0
fHugLinearStiffness = 20
fHugAngularStiffness = 5
fHugDamping = 0.5

[Riding]
; While riding a horse:
; - the outfit's invisible ground plane (VirtualGround) is switched off. It is attached to the rider's root bone,
;   which rides up at saddle height, so it would hold skirts out flat like a disc.
; - riding hug (Main version): short skirts and robes are also tied to the thighs; long skirts hang freely.
; Read when an actor mounts (dismount and mount again after editing).
bRidingHug = 0
; 1 = switch the ground plane off while riding (0 = leave it on)
fRideGroundOff = 1
; 1 = EXPERIMENTAL collider over the horse's back and flanks (off: it makes tied short skirts jitter while riding)
bHorseCollider = 0
; skirts whose cloth reaches further below the knee than this (0 = knee, 1 = ankle) get no riding hug
fRideLongSkirt = 0.18

; --- advanced ---
; riding hug: same meaning as the fHug* settings in [AutoHug] (any fHug* key works here as fRide*)
fRideSurface = 5.5
fRideCenterBlend = 6
fRideBackLift = 0
; horse collider shape (game units; arc in degrees from the top down each flank)
fHorseWidth = 22
fHorseHeight = 30
fHorseFront = 25
fHorseBack = 35
fHorseSaddleDrop = 6
fHorseArc = 110
fHorsePenetration = 8
; EXPERIMENTAL (off): loosen long skirts' own cloth while riding (stiffness multiplier; minimum swing in radians)
fRideRelaxStiffness = 0
fRideRelaxAngle = 0

[Debug]
; 1 = Settle.log lists every cloth bone with its position and why it was / was not tied
bHugDebug = 0
; 1 = write the player's seat collision as .obj into Documents\My Games\Skyrim Special Edition\SKSE\Settle\
bDebugObj = 0
; 1 = Settle.log lists every cloth bone each time an actor mounts
bRideDebug = 0
