; Settle - per-outfit seated-hug overrides
; Any *.ini file in this folder is read every time an actor sits down.
; One section per outfit: the physics XML path exactly as Settle.log shows it in its "hug ..." lines,
; followed by any fHug* keys from Settle.ini that should differ for that outfit only.
;
; Examples (remove the leading ';' to use):
;
; force normal physics (no hug) for one outfit:
;[meshes\armor\SomeAuthor\LongDress.xml]
;fHugLongSkirt = 0.01
;
; always hug an outfit that Settle treats as a long skirt:
;[meshes\armor\SomeAuthor\MidiSkirt.xml]
;fHugLongSkirt = 0
;
; let the cloth sit a little higher on the lap:
;[meshes\armor\SomeAuthor\Robe.xml]
;fHugSurface = 6.5
