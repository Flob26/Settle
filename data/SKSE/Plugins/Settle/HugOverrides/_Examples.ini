; Settle - per-outfit seated-hug overrides
; Any *.ini file in this folder is read every time an actor sits down or mounts a horse.
; One section per outfit: the physics XML path as Settle.log shows it in its "hug ..." lines
; (upper/lower case doesn't matter), followed by any fHug* keys from Settle.ini that should differ
; for that outfit only, or bIgnore = 1.
;
; Examples (remove the leading ';' to use):
;
; leave an item completely alone (no hug while sitting or riding; it still rests on seats):
;[meshes\SomeAuthor\Tail.xml]
;bIgnore = 1
;
; always hug an outfit that Settle treats as a long skirt:
;[meshes\armor\SomeAuthor\MidiSkirt.xml]
;fHugLongSkirt = 0
;
; let the cloth sit a little higher on the lap:
;[meshes\armor\SomeAuthor\Robe.xml]
;fHugSurface = 6.5
